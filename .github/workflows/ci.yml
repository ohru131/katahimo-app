name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # デモ用のコード(PGliteのwasmや架空データ)が本番の配信物に紛れ込んでいないことを、
      # 設定を読むのではなく実際のビルド成果物を検査して確かめる。
      - run: pnpm --filter @katahimo/web build
      - run: node scripts/assertNoDemoInBuild.mjs

      # 公開デモ(GitHub Pages)がビルドできなくなっていないことも各PRで確認する。
      # デプロイして初めて壊れているのに気づく、という状態を避けるため。
      - run: pnpm --filter @katahimo/web build:demo
